# Reusable workflow for building wheels with cibuildwheel and publishing to PyPI.
#
# Usage in consumer projects:
#   jobs:
#     build:
#       uses: shakfu/automate/.github/workflows/reusable-build-wheels.yml@main
#       with:
#         package-name: mypackage
#         publish-target: pypi
#
# IMPORTANT: The calling workflow MUST declare these permissions:
#   permissions:
#     id-token: write    # needed for trusted publishing
#     contents: read
#
# This workflow is self-contained: it makes no nested `uses:` calls, so
# pinning it to a tag or SHA pins everything it runs.
#
# There is no approval step between building and publishing: selecting
# publish-target: pypi on a workflow_dispatch run publishes immediately. Add a
# required reviewer to the `pypi` GitHub environment if you want a human gate;
# that is a repository setting, not something this workflow can enforce.
#
name: Build Wheels

on:
  workflow_call:
    inputs:
      package-name:
        type: string
        required: true
        description: PyPI package name
      publish-target:
        type: string
        default: none
        description: 'Publishing target: none, testpypi, pypi, or both'
      os-matrix:
        type: string
        default: '["ubuntu-latest", "windows-latest", "macos-14"]'
        description: JSON array of runner OS labels for wheel builds
      cibw-build:
        type: string
        default: 'cp310-* cp311-* cp312-* cp313-* cp314-*'
        description: CIBW_BUILD pattern
      cibw-skip:
        type: string
        default: '*-win32 *-manylinux_i686 *-musllinux_* *-win_arm64'
        description: CIBW_SKIP pattern
      cibw-archs-linux:
        type: string
        default: 'x86_64 aarch64'
      cibw-archs-macos:
        type: string
        default: 'x86_64 arm64'
      cibw-archs-windows:
        type: string
        default: AMD64
      cibw-environment-linux:
        type: string
        default: ''
        description: CIBW_ENVIRONMENT_LINUX (e.g. "CFLAGS='-O3 -std=c99'")
      cibw-environment-macos:
        type: string
        default: ''
        description: CIBW_ENVIRONMENT_MACOS
      cibw-test-requires:
        type: string
        default: 'pytest>=8'
      cibw-test-command:
        type: string
        default: 'pytest {project}/tests -v'
      cibw-test-skip:
        type: string
        default: ''
      pypi-skip-existing:
        type: boolean
        default: false
        description: >
          Treat an already-present version on PyPI as success. Off by default:
          a silent no-op looks identical to a successful release. TestPyPI
          always skips existing, where re-running a build is routine.

jobs:
  build_wheels:
    name: Build wheels (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJson(inputs.os-matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          submodules: true

      - uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        env:
          CIBW_BUILD: ${{ inputs.cibw-build }}
          CIBW_SKIP: ${{ inputs.cibw-skip }}
          CIBW_ARCHS_LINUX: ${{ inputs.cibw-archs-linux }}
          CIBW_ARCHS_MACOS: ${{ inputs.cibw-archs-macos }}
          CIBW_ARCHS_WINDOWS: ${{ inputs.cibw-archs-windows }}
          CIBW_ENVIRONMENT_LINUX: ${{ inputs.cibw-environment-linux }}
          CIBW_ENVIRONMENT_MACOS: ${{ inputs.cibw-environment-macos }}
          CIBW_TEST_REQUIRES: ${{ inputs.cibw-test-requires }}
          CIBW_TEST_COMMAND: ${{ inputs.cibw-test-command }}
          CIBW_TEST_SKIP: ${{ inputs.cibw-test-skip }}

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: wheels-${{ matrix.os }}
          path: ./wheelhouse/*.whl

  build_sdist:
    name: Build sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          submodules: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'

      - name: Install build
        run: pip install build

      - name: Build sdist
        run: python -m build --sdist

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: sdist
          path: dist/*.tar.gz

  collect:
    name: Collect artifacts
    needs: [build_wheels, build_sdist]
    runs-on: ubuntu-latest
    steps:
      # Downloaded by explicit name/pattern rather than "everything in the
      # run": a blanket download would sweep up any other artifact the caller
      # uploaded (coverage reports, logs) and publish it to PyPI.
      - name: Download wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          pattern: wheels-*
          path: dist/
          merge-multiple: true

      - name: Download sdist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: sdist
          path: dist/

      - name: Verify distribution contents
        run: |
          echo "Collected $(find dist -type f | wc -l) files:"
          ls -lh dist/
          UNEXPECTED=$(find dist -type f ! -name '*.whl' ! -name '*.tar.gz')
          if [ -n "$UNEXPECTED" ]; then
            echo "refusing to publish non-distribution files:" >&2
            echo "$UNEXPECTED" >&2
            exit 1
          fi
          if [ "$(find dist -type f | wc -l)" -eq 0 ]; then
            echo "no distributions were built" >&2
            exit 1
          fi

      - name: Upload merged artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: all-dist
          path: dist/
          retention-days: 30

  # The publish jobs are inlined rather than delegated to
  # reusable-publish.yml. A `uses:` reference cannot inherit the ref its own
  # workflow was called at, so a nested call has to name one literally --
  # which meant a consumer pinning this workflow to a tag still ran the
  # publish step, the one holding id-token: write, from whatever `main`
  # happened to be. reusable-publish.yml remains available for callers who
  # compose the pieces themselves and can pin it directly.
  publish_testpypi:
    name: Publish to TestPyPI
    if: inputs.publish-target == 'testpypi' || inputs.publish-target == 'both'
    needs: [collect]
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/${{ inputs.package-name }}
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: all-dist
          path: dist/

      - name: List artifacts
        run: ls -lh dist/

      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  publish_pypi:
    name: Publish to PyPI
    if: inputs.publish-target == 'pypi' || inputs.publish-target == 'both'
    needs: [collect]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/${{ inputs.package-name }}
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: all-dist
          path: dist/

      - name: List artifacts
        run: ls -lh dist/

      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # release/v1
        with:
          skip-existing: ${{ inputs.pypi-skip-existing }}
