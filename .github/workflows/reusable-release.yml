# Reusable workflow for creating GitHub Releases with changelog excerpts.
#
# Usage in consumer projects:
#   on:
#     push:
#       tags: ['v*']
#   jobs:
#     release:
#       uses: shakfu/automate/.github/workflows/reusable-release.yml@main
#       with:
#         project-description: "A Python library for doing things."
#
# IMPORTANT: The calling workflow MUST declare these permissions:
#   permissions:
#     contents: write    # needed to create releases
#
# Note on shell safety: every caller-supplied value reaches bash through the
# `env:` block of its step, never through `${{ }}` interpolation inside `run:`.
# GitHub substitutes `${{ }}` textually before bash parses the script, so an
# interpolated value containing a quote, `$(...)`, or a backtick would be
# executed as code rather than read as data. Keep new values in `env:`.
#
name: Release

on:
  workflow_call:
    inputs:
      project-description:
        type: string
        default: ''
        description: One-paragraph project description for the release body
      changelog-path:
        type: string
        default: CHANGELOG.md
        description: Path to the changelog file relative to repo root
      attach-artifacts:
        type: boolean
        default: false
        description: Whether to download and attach artifacts from a prior workflow run
      artifact-name:
        type: string
        default: all-dist
        description: Name of the artifact to download and attach
      automate-ref:
        type: string
        default: main
        description: >
          Git ref of shakfu/automate to install the CLI from. Pin this to a
          tag once one exists; `main` means the release body is generated by
          whatever that branch points at when the release runs.
      lint-changelog:
        type: boolean
        default: true
        description: >
          Run `automate changelog lint` before generating the release body and
          fail on errors. Warnings do not fail the run.
      verify-release:
        type: boolean
        default: true
        description: >
          Run `automate check-release` before generating the release body. Fails
          if the tagged version has no changelog entry, no date, or no content,
          or if pyproject.toml declares a different version.
      pyproject-path:
        type: string
        default: pyproject.toml
        description: >
          Packaging metadata that `check-release` cross-checks the tag against.
          Skipped when the file is absent or declares a dynamic version.

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.12'

      - name: Install automate CLI
        env:
          AUTOMATE_REF: ${{ inputs.automate-ref }}
        run: pip install "git+https://github.com/shakfu/automate.git@${AUTOMATE_REF}"

      - name: Extract version from tag
        id: version
        run: |
          # Without this guard a branch push yields the branch name as the
          # version, and the failure surfaces later as an unhelpful
          # "Version 'main' not found in CHANGELOG.md".
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then
            echo "this workflow must be triggered by a tag push;" >&2
            echo "got ${GITHUB_REF_TYPE} '${GITHUB_REF_NAME}'" >&2
            exit 1
          fi
          # Strip leading 'v' from tag (e.g. v0.2.0 -> 0.2.0)
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Lint changelog
        if: inputs.lint-changelog
        env:
          CHANGELOG_PATH: ${{ inputs.changelog-path }}
        # Errors mean content the release body would drop or misattribute.
        # Better to fail here than to publish notes missing half an entry.
        run: automate changelog lint -f "$CHANGELOG_PATH"

      - name: Verify release
        if: inputs.verify-release
        env:
          VERSION: ${{ steps.version.outputs.version }}
          CHANGELOG_PATH: ${{ inputs.changelog-path }}
          PYPROJECT_PATH: ${{ inputs.pyproject-path }}
        # Stricter than the linter, and scoped to the one version being
        # published: an entry that is missing, undated, or empty becomes a
        # permanent, wrong release record, so it fails here instead.
        run: |
          automate check-release "$VERSION" \
            -f "$CHANGELOG_PATH" \
            --pyproject "$PYPROJECT_PATH"

      - name: Generate release body
        env:
          VERSION: ${{ steps.version.outputs.version }}
          CHANGELOG_PATH: ${{ inputs.changelog-path }}
          PROJECT_DESCRIPTION: ${{ inputs.project-description }}
        run: |
          ARGS=("release-body" "$VERSION" "-f" "$CHANGELOG_PATH")
          if [ -n "$PROJECT_DESCRIPTION" ]; then
            ARGS+=("-d" "$PROJECT_DESCRIPTION")
          fi
          automate "${ARGS[@]}" > release-body.md

      - name: Download artifacts
        if: inputs.attach-artifacts
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.artifact-name }}
          path: dist/

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          ATTACH_ARTIFACTS: ${{ inputs.attach-artifacts }}
        run: |
          ARGS=("gh" "release" "create" "$TAG"
                "--title" "$TAG"
                "--notes-file" "release-body.md")
          if [ "$ATTACH_ARTIFACTS" = "true" ]; then
            # nullglob so an empty dist/ yields no args rather than the
            # literal string "dist/*" being passed to gh.
            shopt -s nullglob
            FILES=(dist/*)
            shopt -u nullglob
            if [ ${#FILES[@]} -eq 0 ]; then
              echo "attach-artifacts is true but dist/ contains no files" >&2
              exit 1
            fi
            ARGS+=("${FILES[@]}")
          fi
          "${ARGS[@]}"
