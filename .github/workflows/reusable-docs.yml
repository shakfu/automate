# Reusable workflow for building and deploying mkdocs to GitHub Pages.
#
# Usage in consumer projects:
#   jobs:
#     docs:
#       uses: shakfu/automate/.github/workflows/reusable-docs.yml@main
#
# IMPORTANT: The calling workflow MUST declare these permissions:
#   permissions:
#     pages: write
#     id-token: write
#
# And GitHub Pages must be configured to deploy from "GitHub Actions" in
# the repository settings.
#
name: Docs

on:
  workflow_call:
    inputs:
      python-version:
        type: string
        default: '3.12'
        description: Python version for building docs
      build-command:
        type: string
        default: 'uv run mkdocs build --strict'
        description: >
          Command to build the docs. Executed as a shell command by design;
          treat callers who can set it as trusted.
      site-dir:
        type: string
        default: site/
        description: Output directory from the build command

jobs:
  build:
    name: Build docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Set up Python ${{ inputs.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ inputs.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
      - name: Sync dependencies
        run: uv sync

      - name: Build docs
        run: ${{ inputs.build-command }}

      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: ${{ inputs.site-dir }}

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1