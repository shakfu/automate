# SHA-pinned actions do not update themselves. Dependabot rewrites the pin and
# the trailing version comment together, which is what makes pinning
# maintainable rather than a slow drift into unpatched actions.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ['*']
