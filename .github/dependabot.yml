# Version tags do not cross majors on their own. Dependabot bumps the ref when
# a new major ships, so the workflows do not sit on an unmaintained one.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ['*']
